name: deploy-cloud

on:
  push:
    branches: [develop]
    paths:
      - "apps/cloud/**"
      - "apps/app/**"
      - "vibestack/alchemy.ts"
      - "vendor/eliza"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: "Target deployment stage"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: "Run alchemy plan without mutating Cloudflare resources"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-cloud-${{ inputs.stage || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  TURBO_TELEMETRY_DISABLED: "1"
  ALCHEMY_FAST_DISTILLED: "1"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          job: deploy-cloud
          verification: "false"
          cache-verification: "false"
      - id: eliza-sha
        run: |
          echo "sha=$(git rev-parse HEAD:vendor/eliza)" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned Eliza cloud build cache
        id: restore-eliza-cloud
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            vendor/eliza/packages/cloud/dist
            vendor/eliza/packages/cloud/gen
            vendor/eliza/packages/cloud-worker/dist
            vendor/eliza/packages/cloud-worker/gen
            vendor/eliza/packages/design-system/generated
          key: eliza-cloud-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.eliza-sha.outputs.node }}-${{ steps.eliza-sha.outputs.sha }}
      - name: Build Grace Cloud worker and verify in offline workerd
        run: |
          pnpm all @grace/cloud#build @grace/cloud#typecheck @grace/cloud#test
          pnpm --filter @grace/cloud test:deploy
      - name: Save pinned Eliza cloud build cache
        if: steps.restore-eliza-cloud.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            vendor/eliza/packages/cloud/dist
            vendor/eliza/packages/cloud/gen
            vendor/eliza/packages/cloud-worker/dist
            vendor/eliza/packages/cloud-worker/gen
            vendor/eliza/packages/design-system/generated
          key: eliza-cloud-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.eliza-sha.outputs.node }}-${{ steps.eliza-sha.outputs.sha }}
      - name: Build stage-specific web assets and return pages
        env:
          STAGE: ${{ inputs.stage || 'staging' }}
        run: |
          if [[ "$STAGE" == "production" ]]; then
            API_ORIGIN="https://api.graceforseniors.com"
            WEB_ORIGIN="https://app.graceforseniors.com"
          else
            API_ORIGIN="https://api-staging.graceforseniors.com"
            WEB_ORIGIN="https://app-staging.graceforseniors.com"
          fi
          VITE_GRACE_CLOUD_API_ORIGIN="$API_ORIGIN" VITE_GRACE_CLOUD_WEB_ORIGIN="$WEB_ORIGIN" \
            pnpm --filter @repo/app build --outDir "../cloud/.wrangler/assets/$STAGE" --emptyOutDir
          cp -R vendor/eliza/packages/cloud-worker/dist/pages/. "apps/cloud/.wrangler/assets/$STAGE/"
      - name: Restore Alchemy local state cache
        if: vars.ALCHEMY_STATE_STORE != 'cloudflare' && vars.R2_STATE_BUCKET == ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: apps/cloud/.alchemy/state
          key: alchemy-state-grace-cloud-${{ inputs.stage || 'staging' }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            alchemy-state-grace-cloud-${{ inputs.stage || 'staging' }}-
      - name: Plan or deploy Grace Cloud via Alchemy
        id: alchemy-deploy
        working-directory: apps/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          ALCHEMY_STATE_STORE: ${{ vars.ALCHEMY_STATE_STORE || '' }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET || '' }}
          R2_STATE_PREFIX: ${{ vars.R2_STATE_PREFIX || '' }}
          R2_STATE_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          R2_STATE_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          HYPERDRIVE_ORIGIN_URL: ${{ secrets.HYPERDRIVE_ORIGIN_URL }}
          STAGE: ${{ inputs.stage || 'staging' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
              echo "::notice::Skipping staging Alchemy deploy because CLOUDFLARE_API_TOKEN is not configured."
              exit 0
            fi
            echo "::error::CLOUDFLARE_API_TOKEN secret is required for workflow_dispatch deployments."
            exit 1
          fi
          pnpm exec alchemy --fast-distilled provider check-env
          if [[ "$DRY_RUN" == "true" ]]; then
            pnpm exec alchemy --fast-distilled plan --config alchemy.run.ts --stage "$STAGE" --adopt
            exit 0
          fi
          pnpm exec alchemy --fast-distilled deploy --config alchemy.run.ts --stage "$STAGE" --adopt --yes --no-input
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Save Alchemy local state cache
        if: >-
          steps.alchemy-deploy.outputs.deployed == 'true' &&
          vars.ALCHEMY_STATE_STORE != 'cloudflare' &&
          vars.R2_STATE_BUCKET == ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: apps/cloud/.alchemy/state
          key: alchemy-state-grace-cloud-${{ inputs.stage || 'staging' }}-${{ github.sha }}-${{ github.run_attempt }}
