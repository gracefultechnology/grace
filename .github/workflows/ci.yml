name: ci

# Ordinary runs use `pnpm verify`, the tools' own self-test included; Turborepo and
# spec skip what the change does not reach, from the cache of the last run.
# The fixed normal profile is the same locally and in CI. The self-test also
# installs and checks each standalone example.
on:
  workflow_dispatch:
    inputs:
      benchmarks_only:
        description: Run the selected benchmarks without the normal verification job
        type: boolean
        default: false
      cross_app_only:
        description: Run the offline Google and cross-app Chromium journeys
        type: boolean
        default: false
      billworld:
        description: Run the pinned 100-biller browser qualification
        type: boolean
        default: true
      billworld_cohort:
        description: Positive cohort number from the pinned Fleet catalog (up to 100 billers each)
        type: string
        default: '1'
      billworld_resume_run:
        description: Optional earlier CI run ID at the exact same product commit
        type: string
        required: false
      webarena:
        description: Run official WebArena Shopping tasks with hosted guidance and controls
        type: boolean
        default: false
      webarena_gitlab:
        description: Run official GitLab public-project task 258 with hosted guidance and controls
        type: boolean
        default: false
      webarena_pending_order:
        description: Include the exploratory Shopping pending-order case in the WebArena run
        type: boolean
        default: false
      webarena_public_search:
        description: Also observe the five official Shopping public searches with a simulated person
        type: boolean
        default: false
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: >-
    ci-${{ github.event_name == 'workflow_dispatch' && inputs.cross_app_only && format('cross-app-{0}', github.sha) ||
    github.event_name == 'pull_request' && !(github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) && format('pr-{0}', github.event.pull_request.number) ||
    github.event_name == 'push' && github.ref != 'refs/heads/develop' && (github.run_attempt == '1' && github.ref || github.run_id) ||
    format('sha-{0}', github.event.pull_request.head.sha || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(github.head_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository) }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  GRACE_BILLWORLD_SELECTED_COHORT: ${{ inputs.billworld_cohort }}
  GRACE_BILLWORLD_REVISION: 8320228bccf0759f375b9633592612e0e570a526

permissions:
  contents: read

jobs:
  webarena:
    if: github.event_name == 'workflow_dispatch' && !inputs.cross_app_only && inputs.webarena
    runs-on: ${{ vars.GRACE_WEBARENA_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SHOPPING_IMAGE: docker.io/am1n3e/webarena-verified-shopping@sha256:3e8cb9b945ea9b1c94ab26dba53e8d12dd0406abbf4bf686fd3bb2b6a5908feb
      SHOPPING_ORIGIN: https://127.0.0.1:7770
      GRACE_WEBARENA_UPSTREAM: ${{ github.workspace }}/.cache/webarena-upstream
      WEBARENA_SEARCH_TASKS: ${{ inputs.webarena_public_search && '[274,275,276,277,278]' || '[]' }}
      WEBARENA_NAVIGATION_TASKS: '[260,261,262,263,264]'
      WEBARENA_RECORD_TASKS: ${{ inputs.webarena_pending_order && '[298,299,300]' || '[298,299]' }}
      WEBARENA_REQUIRED: '[260,261,262,263]'
    steps:
      - &webarena_checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - &webarena_setup
        uses: ./.github/actions/setup
      - &webarena_pinned_catalog
        uses: actions/checkout@v7
        with:
          repository: web-arena-x/webarena
          ref: dce04686a56253aefba7b18a4fa0937cf1dc987b
          path: .cache/webarena-upstream
          persist-credentials: false
      - name: Inventory the pinned WebArena corpus
        run: |
          results_dir="$RUNNER_TEMP/grace-webarena-results"
          install -d -m 700 "$results_dir"
          catalog_object=HEAD:config_files/test.raw.json
          revision=$(git -C "$GRACE_WEBARENA_UPSTREAM" rev-parse HEAD)
          catalog_sha256=$(git -C "$GRACE_WEBARENA_UPSTREAM" show "$catalog_object" | sha256sum | cut -d' ' -f1)
          tasks=$(jq -cn --argjson navigation "$WEBARENA_NAVIGATION_TASKS" --argjson records "$WEBARENA_RECORD_TASKS" --argjson searches "$WEBARENA_SEARCH_TASKS" '$navigation + $records + $searches | sort')
          git -C "$GRACE_WEBARENA_UPSTREAM" show "$catalog_object" |
            jq -e --arg revision "$revision" --arg sha256 "$catalog_sha256" \
              --argjson configured "$tasks" --argjson required "$WEBARENA_REQUIRED" '
              def ids: map(.task_id) | sort;
              def templates: map(.intent_template_id) | unique;
              def members($cohort): map(select(.task_id as $id | $cohort | index($id) != null));
              def coverage:
                {catalog: length, authenticated: (map(select(.require_login)) | length),
                 configuredTaskIds: (members($configured) | ids),
                 requiredTaskIds: (members($required) | ids),
                 unconfigured: (length - (members($configured) | length))};
              select(length > 0 and (ids | length == (unique | length))) |
              select((members($configured) | ids) == ($configured | sort) and
                (members($required) | ids) == ($required | sort) and
                ($required - $configured | length) == 0) |
              {evaluatorRevision: $revision, catalogSha256: $sha256, total: coverage,
               multiSiteTasks: (map(select(.sites | length > 1)) | length),
               intentTemplates: {catalog: (templates | length), configured: (members($configured) | templates), required: (members($required) | templates)},
               groups: (group_by([(.sites | sort), (.eval.eval_types | sort)]) |
                 map({sites: (.[0].sites | sort), evaluatorTypes: (.[0].eval.eval_types | sort)} + coverage))}
            ' > "$results_dir/corpus-coverage.json"
          echo "WEBARENA_TASKS=$tasks" >> "$GITHUB_ENV"
          jq -r '.intentTemplates | "The selected cases cover \(.configured | length) of \(.catalog) intent templates. Required cases cover \(.required | length)."' \
            "$results_dir/corpus-coverage.json" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.total | "The pinned catalog has \(.catalog) tasks. This run configures \(.configuredTaskIds | length) tasks, of which \(.requiredTaskIds | length) are required. \(.unconfigured) tasks are outside this run."' \
            "$results_dir/corpus-coverage.json" >> "$GITHUB_STEP_SUMMARY"
      - &webarena_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - &webarena_evaluator
        name: Prepare the WebArena evaluator
        run: |
          private_dir="$RUNNER_TEMP/grace-webarena-private"
          results_dir="$RUNNER_TEMP/grace-webarena-results"
          install -d -m 700 "$private_dir" "$results_dir"
          python -m venv "$private_dir/venv"
          "$private_dir/venv/bin/python" -m pip install -r "$GRACE_WEBARENA_UPSTREAM/requirements.txt"
          {
            echo "WEBARENA_PRIVATE=$private_dir"
            echo "WEBARENA_RESULTS=$results_dir"
            echo "GRACE_WEBARENA_PYTHON=$private_dir/venv/bin/python"
            echo "GRACE_BROWSER_BENCHMARK_FILE=$private_dir/input.json"
          } >> "$GITHUB_ENV"
          pnpm gen
      - name: Start the pinned Shopping storefront
        run: |
          test "$(uname -m)" = x86_64
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          available=$(sudo df -Pm "$docker_root" | awk 'NR == 2 { print $4 }')
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] && (( available < 24000 )); then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          fi
          sudo df -h "$docker_root"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends caddy
          docker pull --platform linux/amd64 "$SHOPPING_IMAGE"
          docker image inspect --format '{{json .RepoDigests}}' "$SHOPPING_IMAGE" > "$WEBARENA_RESULTS/shopping-image.json"
          docker run -d --name grace-webarena-shopping --platform linux/amd64 \
            -p 127.0.0.1:17771:80 -e WA_ENV_CTRL_EXTERNAL_SITE_URL="$SHOPPING_ORIGIN/" "$SHOPPING_IMAGE"
          ready=false
          for _ in {1..40}; do
            if timeout 10 docker exec grace-webarena-shopping sh -ec '
              mysqladmin ping -h 127.0.0.1 --silent &&
              curl --silent --max-time 5 -o /dev/null -w "%{http_code}" http://127.0.0.1:9200/ |
                grep -Eq "^(200|401)$"
            '; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          docker exec grace-webarena-shopping sh -ec '
            cd /var/www/magento2
            php bin/magento config:set web/unsecure/base_url https://127.0.0.1:7770/
            php bin/magento config:set web/secure/base_url https://127.0.0.1:7770/
            php bin/magento config:set web/secure/use_in_frontend 1
            php bin/magento cache:flush
          '
          cat > "$WEBARENA_PRIVATE/Caddyfile" <<'CADDY'
          {
            admin off
            auto_https disable_redirects
            skip_install_trust
          }
          https://127.0.0.1:7770 {
            bind 127.0.0.1
            tls internal
            reverse_proxy http://127.0.0.1:17771
          }
          CADDY
          XDG_DATA_HOME="$WEBARENA_PRIVATE/caddy-data" XDG_CONFIG_HOME="$WEBARENA_PRIVATE/caddy-config" \
            caddy start --config "$WEBARENA_PRIVATE/Caddyfile" --adapter caddyfile
          status=$(curl --insecure --fail --silent --show-error --max-time 90 -o /dev/null -w '%{http_code}' "$SHOPPING_ORIGIN/")
          test "$status" = 200
      - name: Verify the published synthetic Shopping sign-in
        working-directory: apps/app
        env:
          WA_SHOPPING_FIXTURE_LOGIN: emma.lopez@gmail.com:Password.123
        run: |
          umask 077
          node --input-type=module <<'JS'
          import { chromium } from "playwright";
          const origin = process.env.SHOPPING_ORIGIN;
          const browser = await chromium.launch();
          try {
            const context = await browser.newContext({ ignoreHTTPSErrors: true });
            await context.route("**/*", (route) => {
              const request = route.request();
              if (new URL(request.url()).origin !== origin) return route.abort();
              return request.isNavigationRequest()
                ? route.continue({ headers: { ...request.headers(), "x-m2-customer-auto-login": process.env.WA_SHOPPING_FIXTURE_LOGIN } })
                : route.continue();
            });
            const page = await context.newPage();
            const response = await page.goto(origin + "/customer/account/", { waitUntil: "domcontentloaded", timeout: 120000 });
            if (!response?.ok()) throw new Error("The seeded Shopping account request failed");
            await page.getByRole("heading", { name: "My Account", exact: true }).first().waitFor({ timeout: 120000 });
            await context.storageState({ path: process.env.WEBARENA_PRIVATE + "/shopping-state.json" });
          } finally {
            await browser.close();
          }
          JS
      - name: Grade official Shopping navigation
        env:
          GRACE_BENCHMARK_CLEF_ORIGIN: ${{ vars.GRACE_BENCHMARK_CLEF_ORIGIN }}
          GRACE_BENCHMARK_CLEF_KEY: ${{ secrets.GRACE_BENCHMARK_CLEF_KEY }}
        run: |
          test -n "$GRACE_BENCHMARK_CLEF_ORIGIN" && test -n "$GRACE_BENCHMARK_CLEF_KEY"
          tasks="$WEBARENA_TASKS"
          required="$WEBARENA_REQUIRED"
          records="$WEBARENA_RECORD_TASKS"
          searches="$WEBARENA_SEARCH_TASKS"
          git -C "$GRACE_WEBARENA_UPSTREAM" show HEAD:config_files/test.raw.json |
            jq -e --arg start "$SHOPPING_ORIGIN/" --arg results "$WEBARENA_RESULTS" \
              --arg state "$WEBARENA_PRIVATE/shopping-state.json" --argjson tasks "$tasks" --argjson required "$required" --argjson records "$records" --argjson searches "$searches" \
              '[.[] | select(.task_id as $id | $tasks | index($id)) |
                {taskId: (.task_id | tostring), intent, startUrl: $start, receipt: ($results + "/task-" + (.task_id | tostring) + ".json"),
                 siteStorageState: $state, evaluator: "webarena"} +
                (if .task_id as $id | $required | index($id) then {} else {exploratory: true} end) +
                (if .task_id == 260 then {} else {chat: "upstream", requiredStep:
                  (if .task_id as $id | $records | index($id) then "ReadLatestRecord"
                   elif .task_id as $id | $searches | index($id) then "SearchPublicSite"
                   else "ReachNamedPage" end)} end)] |
                select(map(.taskId | tonumber) == $tasks)' > "$GRACE_BROWSER_BENCHMARK_FILE"
          browser_exit=0
          pnpm --filter @repo/app test:browser test/browser.browser.test.tsx -t 'Follow Grace to a benchmark link' |
            tee "$WEBARENA_RESULTS/grace-browser.log" || browser_exit=$?
          shopt -s nullglob
          receipts=("$WEBARENA_RESULTS"/task-*.json)
          jq -n --argjson tasks "$tasks" '
            [inputs] | group_by(.taskId) as $groups |
            [$groups[] | select(length == 1) | .[0] | select(.taskId as $id | $tasks | index($id | tonumber) != null)] as $unique |
            {configured: ($tasks | length), receipts: ($groups | map(length) | add // 0),
             missingTaskIds: ($tasks - [$groups[][0].taskId | tonumber]),
             duplicateTaskIds: [$groups[] | select(length > 1) | .[0].taskId | tonumber],
             graded: ([$unique[] | select(.webArena.officialScore == 0 or .webArena.officialScore == 1)] | length),
             officialPasses: ([$unique[] | select(.webArena.officialScore == 1)] | length),
             passesWithRejectedControl: ([$unique[] | select(.webArena.officialScore == 1 and .webArena.noActionScore == 0)] | length)}
          ' "${receipts[@]}" </dev/null > "$WEBARENA_RESULTS/run-coverage.json"
          jq -r '"Of \(.configured) configured cases, \(.graded) received an official grade, \(.officialPasses) scored 1, and \(.passesWithRejectedControl) also rejected no action. Missing receipt IDs: \(.missingTaskIds). Duplicate receipt IDs: \(.duplicateTaskIds)."' \
            "$WEBARENA_RESULTS/run-coverage.json" >> "$GITHUB_STEP_SUMMARY"
          jq -es --argjson tasks "$tasks" --argjson required "$required" --argjson records "$records" --argjson searches "$searches" '
            def search_case: (.taskId | tonumber) as $id | $searches | index($id) != null;
            def checked_search:
              search_case and .userAssisted == true and .decisionProvider == "none" and
              .decisionRequests == 0 and .syntheticStorageState == true and .webArena.groundedNavigation == true and
              .webArena.qualifiedHostedGuidance == false;
            def checked_record:
              .outcome as $out | $out.checkedRecord as $record |
              (($out.reviewedSteps // []) | map(.kind)) == ["ReadLatestRecord"] and
              ($record.collectionDocument | type == "string" and length > 0) and
              ($record.detailDocument | type == "string" and length > 0) and
              $record.detailDocument != $record.collectionDocument and
              $record.detailDocument == $out.destination.documentId and
              $record.detailDocument == $out.hops[-1].documentId and
              $record.collectionDocument == ([$out.start] + $out.hops)[-2].documentId;
            def witnessed_record_refusal:
              .outcome as $out | $out.recordRefusal as $refusal |
              ((.taskId | tonumber) as $id | $records | index($id) != null) and
              .chatStatus == 200 and $out.chatProvider == "upstream" and .decisionProvider == "hosted" and
              ($out.reviewedSteps | map(.kind)) == ["ReadLatestRecord"] and
              $out.ringTap == true and .webArena.groundedNavigation == true and
              .webArena.officialScore == 0 and .webArena.qualifiedHostedGuidance == false and
              $out.destination.url == (.startUrl + "sales/order/history/") and
              ($refusal.documentId | type == "string" and length > 0) and $refusal.documentId != $out.start.documentId and
              $refusal.documentId == $out.destination.documentId and $refusal.documentId == $out.hops[-1].documentId and
              $out.destination.url == $out.hops[-1].url and all($out.hops[]; .checked == false) and
              $refusal.kind == "record-check-unavailable" and $refusal.ringAvailable == false and
              ($refusal.instruction | type == "string" and length > 0) and $refusal.visibleAction == "View Order" and
              $refusal.selection == "NoGuidedRecordSelection" and $refusal.receiptCount == 0 and $out.checkedRecord == null;
            def verified_action_budget:
              .outcome as $out |
              ($out.disclosures // []) as $menus |
              ($out.menuRetries // []) as $retries |
              ($out.hops // []) as $hops |
              ($out.nameCorrection // null) as $approval |
              ([$out.start] + $hops) as $documents |
              (($menus | length) + ($retries | length) + ($hops | length) + (if $approval then 1 else 0 end)) == 8 and
              ($menus | length) == ($menus | unique_by([.documentId, .snapshotId]) | length) and
              all($menus[]; (.documentId | type == "string" and length > 0) and
                (.snapshotId | type == "string" and length > 0) and .disclosed == true and .before == 0 and
                (.after | type == "number" and . > 0 and . == floor) and
                (. as $menu | any($documents[]; .documentId == $menu.documentId and .url == $menu.url))) and
              ($retries | length) == ($retries | unique_by([.documentId, .instruction]) | length) and
              all($retries[]; (.instruction | type == "string" and length > 0) and
                (.documentId as $doc | any($menus[]; .documentId == $doc))) and
              ($hops | length) == ($hops | unique_by(.documentId) | length) and
              all($hops[]; .checked == false and (.documentId | type == "string" and length > 0) and .documentId != $out.start.documentId and
                (.url | type == "string" and length > 0)) and
              ($approval == null or (($approval.leaf | type == "string" and length > 0) and
                ($approval.instruction | type == "string" and length > 0) and
                ($approval.documentId as $doc | any($menus[]; .documentId == $doc))));
            sort_by(.taskId | tonumber) |
            select(map(.taskId | tonumber) == $tasks) |
            map({taskId, cohort: (if (.taskId | tonumber) as $id | $required | index($id) then "required" else "exploratory" end),
              miss: .outcome.miss, failed: (.outcome.failure != null), completed: (.outcome.graceTerminal | type == "string"),
              rejectedLeaf: (if .outcome.miss == "rejected-scoped-leaf" then
                .outcome.rejectedNameCorrection as $offer |
                .outcome.disclosures[-1] as $last |
                ($offer.original | type == "string" and length > 0) and $offer.original == .outcome.reviewedDestination and
                ($offer.instruction | type == "string" and length > 0) and
                ($offer.leaf | type == "string" and length > 0) and
                ($offer.branch | type == "string" and length > 0) and
                ($offer.documentId | type == "string" and length > 0) and
                $offer.documentId == $last.documentId and $offer.branch == $last.label and
                ($offer.branchMatches | type == "boolean") and ($offer.leafMatches | type == "boolean") and
                ($offer.branchMatches == false or $offer.leafMatches == false) and
                $offer.offeredControl == ("Use “" + $offer.leaf + "” for this step")
                else false end),
              refusedRecord: (.outcome.miss == "insufficient-record-evidence" and witnessed_record_refusal),
              exhaustedBudget: (.outcome.miss == "action-budget-exhausted" and verified_action_budget),
              officialScore: .webArena.officialScore, noActionScore: .webArena.noActionScore,
              hostedGuidance: (.webArena.qualifiedHostedGuidance == true),
              userAssistedSearch: search_case, checkedUserAssistedSearch: checked_search,
              checkedPlan: (if search_case then checked_search else .outcome.hops[-1].checked == true and
                (.outcome.destination.documentId | type == "string" and length > 0) and
                .outcome.hops[-1].documentId == .outcome.destination.documentId and
                .outcome.start.documentId != .outcome.destination.documentId and
                (.taskId == "260" or (.chatStatus == 200 and .outcome.chatProvider == "upstream" and
                  (if (.taskId | tonumber) as $id | $records | index($id) then checked_record else (.outcome.reviewedDestination | length) > 0 end))) end)})
          ' "${receipts[@]}" </dev/null > "$WEBARENA_RESULTS/scorecard.json"
          jq -r '
            "### WebArena Shopping",
            "",
            "| Official task | Cohort | Landing score | No-action score | Hosted guidance | User-assisted search | Checked plan |",
            "| --- | --- | --- | --- | --- | --- | --- |",
            (.[] | "| \(.taskId) | \(.cohort) | \(.officialScore) | \(.noActionScore) | \(.hostedGuidance) | \(.checkedUserAssistedSearch) | \(.checkedPlan) |")
          ' "$WEBARENA_RESULTS/scorecard.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e '
            all(.[]; (.failed | not) and (.completed == (.miss == null)) and (.completed or (.cohort == "exploratory" and
              (.miss == "missing-reviewed-step" or .miss == "target-absent-from-open-menu" or .miss == "repeated-address" or
                (.miss == "rejected-scoped-leaf" and .rejectedLeaf) or
                (.miss == "insufficient-record-evidence" and .refusedRecord) or
                (.miss == "action-budget-exhausted" and .exhaustedBudget)))) and
              .noActionScore == 0 and (.officialScore == 0 or .officialScore == 1) and
              (.completed == false or (.checkedPlan and (.officialScore == 1 or (.userAssistedSearch and .taskId == "277"))))) and
            all(.[] | select(.userAssistedSearch); .completed and .checkedUserAssistedSearch and (.hostedGuidance | not)) and
            all(.[] | select(.cohort == "required"); .officialScore == 1 and .hostedGuidance and .checkedPlan)
          ' "$WEBARENA_RESULTS/scorecard.json"
          test "$browser_exit" -eq 0
      - name: Exercise the public search and its negative controls in Chromium
        if: ${{ !cancelled() && inputs.webarena_public_search && env.WEBARENA_RESULTS != '' }}
        run: |
          unset GRACE_BROWSER_BENCHMARK_FILE
          pnpm --filter @repo/app test:browser test/app.browser.test.tsx -t 'Check a public search the person performs' \
            --reporter default --reporter json --outputFile.json="$WEBARENA_RESULTS/public-search-journey.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webarena-shopping
          path: |
            ${{ runner.temp }}/grace-webarena-results/shopping-image.json
            ${{ runner.temp }}/grace-webarena-results/corpus-coverage.json
            ${{ runner.temp }}/grace-webarena-results/task-*.json
            ${{ runner.temp }}/grace-webarena-results/scorecard.json
            ${{ runner.temp }}/grace-webarena-results/run-coverage.json
            ${{ runner.temp }}/grace-webarena-results/public-search-journey.json
            ${{ runner.temp }}/grace-webarena-results/grace-browser.log
          if-no-files-found: warn
  webarena-gitlab:
    if: github.event_name == 'workflow_dispatch' && !inputs.cross_app_only && inputs.webarena_gitlab
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GITLAB_IMAGE: docker.io/am1n3e/webarena-verified-gitlab@sha256:673ba94d757c5b3f4bb55751ad8b745a33bad2b987349322403cbc41035a92e0
      GITLAB_ORIGIN: https://127.0.0.1:8023
      GRACE_WEBARENA_UPSTREAM: ${{ github.workspace }}/.cache/webarena-upstream
    steps:
      - *webarena_checkout
      - *webarena_setup
      - *webarena_pinned_catalog
      - *webarena_python
      - *webarena_evaluator
      - name: Start the pinned GitLab fixture
        id: gitlab_start
        run: |
          umask 077
          test "$(uname -m)" = x86_64
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          available=$(sudo df -PB1 "$docker_root" | awk 'NR == 2 { print $4 }')
          inodes=$(sudo df -Pi "$docker_root" | awk 'NR == 2 { print $4 }')
          memory=$(awk '/^MemAvailable:/ { printf "%.0f", $2*1024 }' /proc/meminfo)
          jq -n --argjson disk "$available" --argjson inodes "$inodes" --argjson memory "$memory" \
            '{availableDockerBytes:$disk,availableDockerInodes:$inodes,availableMemoryBytes:$memory}' > "$WEBARENA_RESULTS/capacity.json"
          (( available >= 65000000000 && inodes >= 100000 && memory >= 4294967296 ))
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends caddy
          docker pull --platform linux/amd64 "$GITLAB_IMAGE"
          docker image inspect --format '{{json .RepoDigests}}' "$GITLAB_IMAGE" > "$WEBARENA_RESULTS/gitlab-image.json"
          docker create --name grace-webarena-gitlab --platform linux/amd64 --shm-size 2gb \
            -p 127.0.0.1:18023:8023 -e WA_ENV_CTRL_ENABLE=false \
            -e WA_ENV_CTRL_EXTERNAL_SITE_URL="$GITLAB_ORIGIN" "$GITLAB_IMAGE"
          docker cp grace-webarena-gitlab:/etc/gitlab/gitlab.rb "$WEBARENA_PRIVATE/gitlab.rb"
          printf "\nexternal_url '%s'\n" "$GITLAB_ORIGIN" >> "$WEBARENA_PRIVATE/gitlab.rb"
          cat >> "$WEBARENA_PRIVATE/gitlab.rb" <<'RUBY'

          nginx['listen_port'] = 8023
          nginx['listen_https'] = false
          letsencrypt['enable'] = false
          RUBY
          docker cp "$WEBARENA_PRIVATE/gitlab.rb" grace-webarena-gitlab:/etc/gitlab/gitlab.rb
          docker start grace-webarena-gitlab
          cat > "$WEBARENA_PRIVATE/Caddyfile" <<'CADDY'
          {
            admin off
            auto_https disable_redirects
            skip_install_trust
          }
          https://127.0.0.1:8023 {
            bind 127.0.0.1
            tls internal
            reverse_proxy http://127.0.0.1:18023
          }
          CADDY
          XDG_DATA_HOME="$WEBARENA_PRIVATE/caddy-data" XDG_CONFIG_HOME="$WEBARENA_PRIVATE/caddy-config" \
            caddy start --config "$WEBARENA_PRIVATE/Caddyfile" --adapter caddyfile
          site=grace-webarena-gitlab
          started=$SECONDS
          boot_complete=false
          sign_in_ready=false
          consecutive=0
          rails=000
          while (( SECONDS - started < 900 )); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$site")" != true ]]; then
              break
            fi
            if [[ "$boot_complete" == false ]] &&
                docker logs "$site" 2>&1 | grep -Fx 'GitLab is ready' >/dev/null; then
              boot_complete=true
            fi
            if [[ "$boot_complete" == true ]]; then
              rails=$(docker exec "$site" sh -c 'curl -sS --max-time 5 -o /dev/null -w "%{http_code}" "http://127.0.0.1:8023/-/readiness?all=1"' 2>/dev/null || true)
              if [[ "$rails" == 200 ]]; then
                consecutive=$((consecutive + 1))
              else
                consecutive=0
              fi
            fi
            if (( consecutive >= 2 )) &&
                curl --insecure --fail --silent --max-time 10 "$GITLAB_ORIGIN/users/sign_in" -o "$WEBARENA_PRIVATE/sign-in.html" &&
                grep -Fq 'data-testid="username-field"' "$WEBARENA_PRIVATE/sign-in.html"; then
              sign_in_ready=true
              break
            fi
            sleep 10
          done
          jq -n --argjson boot "$boot_complete" --argjson signIn "$sign_in_ready" --arg rails "$rails" \
            --argjson consecutive "$consecutive" --argjson elapsed "$((SECONDS - started))" \
            '{entrypointReady:$boot, signInReady:$signIn, railsReadinessStatus:($rails|tonumber? // null),
              consecutiveRailsReady:$consecutive, elapsedSeconds:$elapsed}' > "$WEBARENA_RESULTS/readiness.json"
          if [[ "$sign_in_ready" != true ]]; then
            echo "GitLab did not reach dependent-service readiness and serve the synthetic sign-in form"
            exit 1
          fi
      - name: Verify the pinned GitLab synthetic sign-in
        id: gitlab_sign_in
        working-directory: apps/app
        run: |
          umask 077
          python - "$GRACE_WEBARENA_UPSTREAM/browser_env/env_config.py" > "$WEBARENA_PRIVATE/gitlab-login.json" <<'PY'
          import ast
          import json
          import pathlib
          import sys
          source = ast.parse(pathlib.Path(sys.argv[1]).read_text())
          accounts = next(node.value for node in source.body if isinstance(node, ast.Assign) and
              any(isinstance(target, ast.Name) and target.id == "ACCOUNTS" for target in node.targets))
          json.dump(ast.literal_eval(accounts)["gitlab"], sys.stdout)
          PY
          node --input-type=module <<'JS'
          import { readFile, writeFile } from "node:fs/promises";
          import { scheduler } from "node:timers/promises";
          import { chromium } from "playwright";
          const origin = process.env.GITLAB_ORIGIN;
          const privateDir = process.env.WEBARENA_PRIVATE;
          const selectors = { username: "username-field", password: "password-field", submit: "sign-in-button" };
          const diagnostic = { signedIn: false, phase: "read-seeded-login", completed: [], documents: [] };
          const siteDocument = (url) => url.origin !== origin ? "other-origin" :
            url.pathname === "/users/sign_in" ? "sign-in" :
            url.pathname === "/-/profile" ? "profile" : url.pathname === "/" ? "home" : "other-local";
          const started = performance.now();
          const advance = (phase) => {
            diagnostic.completed.push({ phase: diagnostic.phase, elapsedMs: Math.round(performance.now() - started) });
            diagnostic.phase = phase;
          };
          let browser;
          let page;
          try {
            const { username, password } = JSON.parse(await readFile(privateDir + "/gitlab-login.json", "utf8"));
            advance("launch-chromium");
            browser = await chromium.launch();
            const context = await browser.newContext({ ignoreHTTPSErrors: true, serviceWorkers: "block" });
            await context.route("**/*", (route) => {
              const request = route.request();
              const url = new URL(request.url());
              const login = request.method() === "POST" && url.pathname === "/users/sign_in";
              return url.origin === origin && (login || ["GET", "HEAD"].includes(request.method())) ? route.continue() : route.abort();
            });
            page = await context.newPage();
            page.on("response", (response) => {
              const request = response.request();
              if (!request.isNavigationRequest() || request.resourceType() !== "document" || diagnostic.documents.length >= 16)
                return;
              const document = siteDocument(new URL(response.url()));
              if (document === "other-origin") return;
              const submission = request.method() === "POST" && document === "sign-in";
              if (!submission && request.method() !== "GET") return;
              diagnostic.documents.push({ document, submission, status: response.status(),
                elapsedMs: Math.round(performance.now() - started) });
            });
            advance("load-sign-in");
            const signIn = await page.goto(origin + "/users/sign_in", { timeout: 120000 });
            diagnostic.signInStatus = signIn?.status() ?? null;
            const signInUrl = new URL(page.url());
            if (!signIn?.ok() || signInUrl.origin !== origin || signInUrl.pathname !== "/users/sign_in")
              throw new Error("Synthetic sign-in did not open");
            advance("fill-username");
            await page.getByTestId(selectors.username).fill(username);
            advance("fill-password");
            await page.getByTestId(selectors.password).fill(password);
            advance("submit-sign-in");
            await page.getByTestId(selectors.submit).click();
            advance("wait-for-authenticated-navigation");
            await page.waitForURL((url) => url.origin === origin && url.pathname !== "/users/sign_in", { timeout: 120000 });
            advance("verify-profile");
            const profileUrl = origin + "/-/profile";
            diagnostic.profileAttempts = [];
            for (let attempt = 0; attempt < 6; attempt++) {
              const profile = await page.goto(profileUrl, { timeout: 120000 });
              const expectedProfile = page.url() === profileUrl;
              diagnostic.profileStatus = profile?.status() ?? null;
              diagnostic.profileAttempts.push({ status: diagnostic.profileStatus, expectedProfile });
              if (profile?.ok() && expectedProfile) break;
              if (!expectedProfile || ![502, 503, 504].includes(diagnostic.profileStatus) || attempt === 5)
                throw new Error("Synthetic profile did not open");
              await scheduler.wait(2000);
            }
            advance("verify-home");
            const start = await page.goto(origin + "/", { timeout: 120000 });
            diagnostic.homeStatus = start?.status() ?? null;
            if (!start?.ok() || page.url() !== origin + "/") throw new Error("The authenticated GitLab home did not open");
            advance("save-private-state");
            await context.storageState({ path: privateDir + "/gitlab-state.json" });
            advance("verified");
            diagnostic.signedIn = true;
          } catch (error) {
            diagnostic.timedOut = error instanceof Error && error.name === "TimeoutError";
            if (page) {
              diagnostic.document = siteDocument(new URL(page.url()));
              if (diagnostic.document === "sign-in") diagnostic.controls = await Promise.race([
                page.evaluate((controls) => Object.fromEntries(Object.entries(controls).map(([name, id]) => {
                  const nodes = document.querySelectorAll(`[data-testid="${id}"]`);
                  const node = nodes[0];
                  return [name, { count: Math.min(nodes.length, 2),
                    visible: node?.checkVisibility({ checkVisibilityCSS: true, checkOpacity: true }) ?? false,
                    enabled: node ? !node.matches(':disabled,[aria-disabled="true"]') : false,
                    readOnly: node?.matches("[readonly]") ?? false,
                    sameOriginPost: node?.form?.method === "post" && node.form.action === location.origin + "/users/sign_in" }];
                })), selectors).catch(() => null),
                new Promise((resolve) => AbortSignal.timeout(3000).addEventListener("abort", () => resolve(null), { once: true })),
              ]);
            }
            throw new Error(`The isolated synthetic GitLab sign-in failed during ${diagnostic.phase}`);
          } finally {
            diagnostic.elapsedMs = Math.round(performance.now() - started);
            try {
              await writeFile(process.env.WEBARENA_RESULTS + "/authentication.json", JSON.stringify(diagnostic, null, 2));
            } finally {
              await browser?.close();
            }
          }
          JS
      - name: Record local GitLab service readiness after fixture or sign-in failure
        if: failure() && (steps.gitlab_start.outcome == 'failure' || steps.gitlab_sign_in.outcome == 'failure')
        run: |
          site=grace-webarena-gitlab
          if ! docker inspect "$site" >/dev/null 2>&1; then exit 0; fi
          state=$(docker inspect --format '{{json .State}}' "$site" | jq '{running:.Running, restarting:.Restarting, oomKilled:.OOMKilled, exitCode:.ExitCode}')
          rails=$(docker exec "$site" sh -c 'curl -sS --max-time 5 -o /dev/null -w "%{http_code}" "http://127.0.0.1:8023/-/readiness?all=1"' 2>/dev/null || true)
          services=$(docker exec "$site" gitlab-ctl status 2>/dev/null |
            awk 'match($0,/^(run|down): (gitaly|nginx|postgresql|puma|redis|sidekiq|gitlab-workhorse):/){print $2, $1}' |
            jq -Rn '[inputs | split(" ") | {(.[0] | rtrimstr(":")): (.[1] | rtrimstr(":"))}] | add // {}') || services='{}'
          memory=$(docker exec "$site" sh -c 'cat /sys/fs/cgroup/memory.events' 2>/dev/null |
            awk '$1 ~ /^(oom|oom_kill|max)$/ && $2 ~ /^[0-9]+$/ { print $1, $2 }' |
            jq -Rn '[inputs | split(" ") | {(.[0]): (.[1] | tonumber)}] | add // {}') || memory='{}'
          available=$(awk '/^MemAvailable:/ { printf "%.0f", $2*1024 }' /proc/meminfo)
          jq -n --argjson state "$state" --arg rails "$rails" --argjson services "$services" --argjson memory "$memory" \
            --argjson available "$available" \
            '{container:$state, railsReadinessStatus:($rails|tonumber? // null), services:$services, memoryEvents:$memory, availableMemoryBytes:$available}' \
            > "$WEBARENA_RESULTS/profile-readiness.json"
      - name: Grade official GitLab public-project navigation
        env:
          GRACE_BENCHMARK_CLEF_ORIGIN: ${{ vars.GRACE_BENCHMARK_CLEF_ORIGIN }}
          GRACE_BENCHMARK_CLEF_KEY: ${{ secrets.GRACE_BENCHMARK_CLEF_KEY }}
        run: |
          test -n "$GRACE_BENCHMARK_CLEF_ORIGIN" && test -n "$GRACE_BENCHMARK_CLEF_KEY"
          git -C "$GRACE_WEBARENA_UPSTREAM" show HEAD:config_files/test.raw.json |
            jq -e --arg start "$GITLAB_ORIGIN/" --arg state "$WEBARENA_PRIVATE/gitlab-state.json" --arg receipt "$WEBARENA_RESULTS/task-258.json" '
              [.[] | select(.task_id == 258 and .sites == ["gitlab"] and .require_login) |
                {taskId: (.task_id | tostring), intent, startUrl: $start, receipt: $receipt,
                 siteStorageState: $state, evaluator: "webarena", chat: "upstream", requiredStep: "ReachNamedPage"}] |
              select(length == 1)' > "$GRACE_BROWSER_BENCHMARK_FILE"
          browser_exit=0
          pnpm --filter @repo/app test:browser test/browser.browser.test.tsx -t 'Follow Grace to a benchmark link 258' |
            tee "$WEBARENA_PRIVATE/grace-browser.log" || browser_exit=$?
          jq -e '
            .taskId == "258" and .chatStatus == 200 and .outcome.chatProvider == "upstream" and
            .decisionProvider == "hosted" and .outcome.ringTap == true and
            (.outcome.reviewedSteps | map(.kind)) == ["ReachNamedPage"] and
            .outcome.failure == null and .outcome.hops[-1].checked == true and
            .outcome.hops[-1].documentId == .outcome.destination.documentId and
            .webArena.site == "gitlab" and .webArena.officialScore == 1 and .webArena.noActionScore == 0 and
            .webArena.groundedNavigation and .webArena.qualifiedHostedGuidance
          ' "$WEBARENA_RESULTS/task-258.json"
          test "$browser_exit" -eq 0
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webarena-gitlab
          path: |
            ${{ runner.temp }}/grace-webarena-results/capacity.json
            ${{ runner.temp }}/grace-webarena-results/gitlab-image.json
            ${{ runner.temp }}/grace-webarena-results/readiness.json
            ${{ runner.temp }}/grace-webarena-results/authentication.json
            ${{ runner.temp }}/grace-webarena-results/profile-readiness.json
            ${{ runner.temp }}/grace-webarena-results/task-258.json
          if-no-files-found: warn
  billworld:
    if: github.event_name == 'workflow_dispatch' && !inputs.cross_app_only && inputs.billworld
    permissions:
      actions: read
      contents: read
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.repository_id == '1457180554' && vars.GRACE_BILLWORLD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - uses: actions/checkout@v7
        with:
          repository: gracefultechnology/billworld
          ref: ${{ env.GRACE_BILLWORLD_REVISION }}
          path: .cache/billworld
          persist-credentials: false
      - run: pnpm gen
      - if: inputs.billworld_resume_run != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.billworld_resume_run }}
          name: billworld-browser-receipts-${{ matrix.shard }}
          path: ${{ runner.temp }}/grace-fleet
      - if: inputs.billworld_resume_run != ''
        name: Select the previous Fleet result directory
        shell: bash
        run: |
          mapfile -t manifests < <(find "$RUNNER_TEMP/grace-fleet" -name cohort.json -type f)
          test "${#manifests[@]}" -eq 1
          printf 'GRACE_BILLWORLD_RESUME_DIR=%s\n' "$(dirname "${manifests[0]}")" >> "$GITHUB_ENV"
      - name: Follow Grace through the Fleet cohort
        env:
          GRACE_BILLWORLD_DIR: ${{ github.workspace }}/.cache/billworld
          GRACE_BILLWORLD_RESULTS: ${{ runner.temp }}/grace-fleet
          GRACE_BILLWORLD_COHORT: ${{ env.GRACE_BILLWORLD_SELECTED_COHORT }}
          GRACE_BILLWORLD_SHARD: ${{ matrix.shard }}
          GRACE_BENCHMARK_CLEF_ORIGIN: ${{ vars.GRACE_BENCHMARK_CLEF_ORIGIN }}
          GRACE_BENCHMARK_CLEF_KEY: ${{ secrets.GRACE_BENCHMARK_CLEF_KEY }}
        run: pnpm --filter @repo/app test:browser test/browser.browser.test.tsx -t 'Follow Grace to a benchmark link' --passWithNoTests
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: billworld-browser-receipts-${{ matrix.shard }}
          path: ${{ runner.temp }}/grace-fleet
          if-no-files-found: error
  billworld-aggregate:
    if: always() && github.event_name == 'workflow_dispatch' && !inputs.cross_app_only && inputs.billworld
    needs: billworld
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.repository_id == '1457180554' && vars.GRACE_BILLWORLD_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/checkout@v7
        with:
          repository: gracefultechnology/billworld
          ref: ${{ env.GRACE_BILLWORLD_REVISION }}
          path: .cache/billworld
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: billworld-browser-receipts-*
          path: ${{ runner.temp }}/grace-fleet-shards
      - name: Verify the independently graded browser receipts
        env:
          GRACE_BILLWORLD_RESULTS: ${{ runner.temp }}/grace-fleet-shards
          GRACE_BILLWORLD_MATRIX_RESULT: ${{ needs.billworld.result }}
          GRACE_PRODUCT_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          import { writeFileSync } from "node:fs";
          import { join, resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const input = process.env.GRACE_BILLWORLD_SELECTED_COHORT;
          const cohort = Number(input);
          if (!/^[1-9][0-9]*$/.test(input) || !Number.isSafeInteger(cohort))
            throw new Error("The Fleet cohort must be a positive integer");
          const tree = resolve(".cache/billworld");
          const git = (...args) => execFileSync("git", ["-C", tree, ...args], { encoding: "utf8" }).trim();
          if (git("rev-parse", "HEAD") !== process.env.GRACE_BILLWORLD_REVISION ||
              git("status", "--porcelain", "--", "categories", "billworld/fleet"))
            throw new Error("Fleet qualification requires the unmodified pinned BillWorld sources");
          const load = (module) => import(pathToFileURL(join(tree, "billworld", "fleet", module)).href);
          const [{ loadCatalog }, { loadTemplates, templateFor }] = await Promise.all([load("catalog.mjs"), load("server.mjs")]);
          const { billers } = loadCatalog();
          const cohortSize = 100;
          const cohortCount = Math.ceil(billers.size / cohortSize);
          if (cohort > cohortCount) throw new Error(`The pinned Fleet catalog has only ${cohortCount} cohorts`);
          const sorted = [...billers.values()].sort((a, b) =>
            a.template.localeCompare(b.template, "en") || a.id.localeCompare(b.id, "en"));
          const familySizes = new Map();
          const ordered = sorted.map((biller) => {
            const rank = familySizes.get(biller.template) ?? 0;
            familySizes.set(biller.template, rank + 1);
            return { biller, rank };
          }).sort((a, b) => a.rank - b.rank);
          await loadTemplates();
          const landmarks = ordered.slice((cohort - 1) * cohortSize, cohort * cohortSize).map(({ biller }) => {
            const { routes } = templateFor(biller);
            const prefix = "/b/" + encodeURIComponent(biller.id);
            return [biller.id, biller.template, biller.signal, prefix + routes.home, prefix + routes.help];
          });
          writeFileSync(join(process.env.RUNNER_TEMP, "fleet-expected-landmarks.json"), JSON.stringify(landmarks));
          JS
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path(os.environ["GRACE_BILLWORLD_RESULTS"])
          revision = os.environ["GRACE_BILLWORLD_REVISION"]
          product_revision = os.environ["GRACE_PRODUCT_REVISION"]
          cohort_number = int(os.environ["GRACE_BILLWORLD_SELECTED_COHORT"])
          verified = {}
          documents = set()

          def load(path):
              if not path.is_file():
                  raise SystemExit(f"Missing Fleet receipt {path}")
              return json.loads(path.read_text())

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def selected_candidate(decision):
              result = decision.get("result") or {}
              choice = result.get("choice")
              candidates = decision.get("candidates")
              confidence = result.get("confidence")
              return (decision.get("http") == 200 and result.get("status") == "ok" and
                      result.get("model") == "clef-flash" and type(candidates) is int and 1 <= candidates <= 16 and
                      isinstance(choice, str) and choice in map(str, range(1, candidates + 1)) and
                      type(confidence) in (int, float) and 0 <= confidence <= 1)

          def loopback(value):
              url = urlsplit(value)
              require(url.scheme == "https" and url.hostname == "127.0.0.1" and url.port and
                      url.username is None and url.password is None, f"Invalid Fleet loopback URL {value}")
              return url

          landmarks = load(Path(os.environ["RUNNER_TEMP"]) / "fleet-expected-landmarks.json")
          cohort = [(biller, template, evidence, urlsplit(start)[2:], urlsplit(landing)[2:])
                    for biller, template, evidence, start, landing in landmarks]
          cohort_total = len(cohort)

          for shard in range(1, 5):
              manifests = list((root / f"billworld-browser-receipts-{shard}").rglob("cohort.json"))
              require(len(manifests) == 1, f"Expected one Fleet cohort manifest for shard {shard}")
              manifest = load(manifests[0])
              require(
                  (manifest["revision"], manifest["productRevision"], manifest["shard"], manifest["shardCount"]) ==
                  (revision, product_revision, shard, 4),
                  f"Wrong Fleet revision or shard metadata for shard {shard}",
              )
              require(manifest.get("cohortNumber", 1) == cohort_number and manifest.get("navigation") == "public support page",
                      f"Wrong selected Fleet cohort on shard {shard}")
              tasks = manifest["cohort"]
              identity = [
                  (task["taskId"], task["template"], task["evidence"], loopback(task["startUrl"])[2:], loopback(task["expected"])[2:])
                  for task in tasks
              ]
              require(identity == cohort, f"Fleet cohort differs from the pinned catalog on shard {shard}")
              assigned = {task["taskId"]: task for task in tasks[shard - 1::4]}
              shard_total = len(assigned)
              directory = manifests[0].parent
              require({path.stem for path in directory.glob("*.json")} == ({"cohort", "scores"} | set(assigned)),
                      f"Wrong receipt membership on shard {shard}")
              scores = load(directory / "scores.json")
              require(
                  (scores["revision"], scores["productRevision"], scores["shard"], scores["shardCount"], scores["cohortTotal"],
                   scores["attempted"], scores["total"], scores["passed"]) == (revision, product_revision, shard, 4, cohort_total, shard_total, shard_total, shard_total),
                  f"Incomplete or failed Fleet score for shard {shard}",
              )
              require(scores.get("cohortNumber", 1) == cohort_number, f"Wrong score cohort on shard {shard}")
              require(set(scores["cases"]) == set(assigned), f"Wrong case membership on shard {shard}")
              for task_id, task in assigned.items():
                  require(Path(task_id).name == task_id and task_id not in (".", ".."), "Invalid Fleet task ID")
                  receipt = load(directory / f"{task_id}.json")
                  grade = receipt["grade"]
                  outcome = receipt["outcome"]
                  opened = outcome["start"]
                  landed = outcome["destination"]
                  last = (outcome["hops"] or [{}])[-1]
                  ids = (opened["documentId"], landed["documentId"])
                  decisions = receipt["decisionResults"]
                  start = loopback(receipt["startUrl"])
                  destination = loopback(grade["destination"])
                  require(task_id not in verified and scores["cases"][task_id] is True and
                          receipt["surface"] == "desktop-chromium" and receipt["taskId"] == task_id and
                          start[2:] == loopback(task["startUrl"])[2:] and
                          destination[2:] == loopback(task["expected"])[2:] and start[:2] == destination[:2] and
                          receipt["decisionProvider"] == "hosted" and receipt["decisionRequests"] == len(decisions) and
                          any(selected_candidate(d) for d in decisions) and
                          all(isinstance(doc, str) and doc and doc not in documents for doc in ids) and ids[0] != ids[1] and
                          opened["url"] == receipt["startUrl"] and landed["url"] == grade["destination"] and
                          (last.get("url"), last.get("documentId")) == (landed["url"], ids[1]) and last.get("checked") is True and
                          isinstance(outcome["graceTerminal"], str) and outcome["graceTerminal"] and
                          outcome["ringTap"] is True and outcome.get("failure") is None and
                          grade["passed"] is True and grade["visible"] is True and
                          grade["expected"] == grade["destination"] != receipt["startUrl"],
                          f"Duplicate or failed Fleet browser receipt for {task_id}")
                  verified[task_id] = shard
                  documents.update(ids)

          require(len(verified) == cohort_total, f"Expected {cohort_total} distinct verified Fleet browser receipts")
          require(os.environ["GRACE_BILLWORLD_MATRIX_RESULT"] == "success", "A Fleet shard job did not succeed")
          (root / "qualification.json").write_text(json.dumps(
              {"revision": revision, "productRevision": product_revision, "cohortNumber": cohort_number, "checked": cohort_total, "passed": cohort_total, "shards": 4, "cases": verified}, indent=2
          ) + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write(f"Verified **{cohort_total} of {cohort_total}** distinct Fleet billers in cohort {cohort_number} across four shards.\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: billworld-browser-qualification
          path: ${{ runner.temp }}/grace-fleet-shards/qualification.json
          if-no-files-found: error
  billworld-released:
    if: github.event_name == 'workflow_dispatch' && !inputs.cross_app_only && inputs.billworld
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.repository_id == '1457180554' && vars.GRACE_BILLWORLD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      GRACE_BILLWORLD_RELEASED_DIR: ${{ github.workspace }}/.cache/billworld
      GRACE_BILLWORLD_RESULTS: ${{ github.workspace }}/.cache/grace-released-billworld-results
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - uses: actions/checkout@v7
        with:
          repository: gracefultechnology/billworld
          ref: ${{ env.GRACE_BILLWORLD_REVISION }}
          path: .cache/billworld
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: .cache/billworld/billworld/public/reference-assets
          key: billworld-released-pdfs-v1-${{ env.GRACE_BILLWORLD_REVISION }}
      - name: Prepare and verify the public fixture assets
        run: |
          node --input-type=module <<'JS'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { existsSync, mkdirSync, readFileSync, renameSync, rmSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const tree = process.env.GRACE_BILLWORLD_RELEASED_DIR;
          const pin = process.env.GRACE_BILLWORLD_REVISION;
          const revision = execFileSync("git", ["-C", tree, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (revision !== pin) throw new Error("Wrong released BillWorld revision");
          const upstream = "billworld/research/wvu-documents.json";
          const manifest = JSON.parse(execFileSync("git", ["-C", tree, "show", `${pin}:${upstream}`], { encoding: "utf8" }));
          const names = ["wvu-billing-collections-policy.pdf", "wvu-financial-assistance-policy.pdf", "wvu-sample-statement.pdf"];
          if (manifest.mode !== "public_read_only_GET" ||
              JSON.stringify(manifest.documents.map(({ file }) => file).sort()) !== JSON.stringify(names))
            throw new Error("Unexpected pinned public PDF manifest");

          const publicDir = join(tree, "billworld", "public");
          const assetsDir = join(publicDir, "reference-assets");
          mkdirSync(assetsDir, { recursive: true });
          mkdirSync(join(publicDir, "reference-pages"), { recursive: true });
          const assets = [];
          for (const { file, url, sha256, bytes } of manifest.documents) {
            const source = new URL(url);
            if (source.protocol !== "https:" || source.hostname !== "wvumedicine.org" ||
                source.username || source.password || !/^[a-f0-9]{64}$/.test(sha256) || !Number.isSafeInteger(bytes) || bytes <= 0)
              throw new Error(`Invalid pinned public asset record for ${file}`);
            const target = join(assetsDir, file);
            const check = (path) => {
              const data = readFileSync(path);
              if (data.length !== bytes || createHash("sha256").update(data).digest("hex") !== sha256)
                throw new Error(`Pinned size or SHA-256 mismatch for ${file}`);
            };
            if (existsSync(target)) check(target);
            else {
              const download = target + ".download";
              try {
                execFileSync("curl", ["--fail", "--silent", "--show-error", "--retry", "3", "--max-time", "60",
                  "--proto", "=https", "--output", download, source.href], { stdio: "inherit" });
                check(download);
                renameSync(download, target);
              } finally {
                rmSync(download, { force: true });
              }
            }
            assets.push({ file, source: source.href, sha256, bytes });
          }
          mkdirSync(process.env.GRACE_BILLWORLD_RESULTS, { recursive: true });
          writeFileSync(join(process.env.GRACE_BILLWORLD_RESULTS, "assets.json"),
            JSON.stringify({ revision, upstream, assets }, null, 2) + "\n");
          JS
      - run: pnpm gen
      - name: Read the released and Fleet statements through Grace
        run: pnpm --filter @repo/app test:browser test/browser.browser.test.tsx -t 'Read the .* BillWorld statement'
      - name: Require the negative witness and six positive checks
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";

          const results = process.env.GRACE_BILLWORLD_RESULTS;
          const episodes = readdirSync(results).filter((name) => name.startsWith("released-statement-"));
          assert.equal(episodes.length, 1, "Expected one released BillWorld episode pair");
          const read = (name) => JSON.parse(readFileSync(join(results, episodes[0], name), "utf8"));
          const checks = {
            statement_viewed_after_login: true, due_date_reported: true, amount_reported: true,
            protected_state_unchanged: true, credentials_unchanged: true, no_forbidden_operations: true
          };
          const negative = read("no-action.json");
          const positive = read("grace-answer.json");
          for (const receipt of [negative, positive]) {
            assert.equal(receipt.revision, process.env.GRACE_BILLWORLD_REVISION);
            assert.equal(receipt.releasedId, "task_md9");
            assert.equal(receipt.grade.taskId, "malden-view-bill-v1");
            assert.equal(receipt.grade.constructionSlice, false);
            assert.equal(receipt.grade.actionBudgetEnforced, true);
            assert.equal(receipt.grade.withinTimeBudget, true);
            assert.equal(receipt.grade.withinActionBudget, true);
          }
          for (const key of ["environmentBuildId", "evaluatorBuildId"]) {
            assert.ok(negative.grade[key]);
            assert.equal(negative.grade[key], positive.grade[key]);
          }
          assert.equal(negative.source, "grader_validation");
          assert.equal(negative.grade.success, false);
          assert.equal(negative.grade.actionsUsed, 0);
          assert.deepEqual(negative.grade.checks, { ...checks,
            statement_viewed_after_login: false, due_date_reported: false, amount_reported: false });
          assert.equal(positive.source, "reference_script");
          assert.equal(positive.grade.success, true);
          assert.ok(positive.grade.actionsUsed > 0);
          assert.deepEqual(positive.grade.checks, checks);
          JS
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: billworld-released-task-md9
          path: |
            ${{ github.workspace }}/.cache/grace-released-billworld-results/assets.json
            ${{ github.workspace }}/.cache/grace-released-billworld-results/released-statement-*/
          if-no-files-found: error
      - if: always()
        name: Report Fleet view-bill coverage and require the assigned cases
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { fleetStatementCoverage } from "./apps/app/test/fleet.fixture.ts";

          const results = process.env.GRACE_BILLWORLD_RESULTS;
          const coverage = await fleetStatementCoverage({
            directory: process.env.GRACE_BILLWORLD_RELEASED_DIR,
            results,
            productRevision: process.env.GITHUB_SHA,
          });
          mkdirSync(results, { recursive: true });
          writeFileSync(join(results, "fleet-view-bill-qualification.json"), JSON.stringify(coverage, null, 2) + "\n");
          const summary = [
            "### Fleet view-bill coverage",
            "",
            "| Status | Unique simulator websites | Portal templates |",
            "| --- | ---: | ---: |",
            ...Object.entries(coverage.totals).map(([status, { websites, templates }]) =>
              `| ${status === "expectedRefusalsGraded" ? "expected refusals graded" : status} | ${websites} | ${templates} |`),
            "",
            `Fleet catalog websites: ${coverage.catalogWebsites}`,
            `Eligible templates without a passing receipt: ${coverage.templatesWithoutPassingReceipt.join(", ") || "none"}`,
            `Required websites with an unmet expectation: ${coverage.requiredWebsitesWithUnmetExpectation.join(", ") || "none"}`,
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
          if (!coverage.requiredComplete) throw new Error("Fleet view-bill grades or controls are missing, duplicated, or differ from their expectations");
          JS
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: billworld-fleet-view-bill
          path: |
            ${{ github.workspace }}/.cache/grace-released-billworld-results/fleet-view-bill-*/
            ${{ github.workspace }}/.cache/grace-released-billworld-results/fleet-statement-refusal-*/
            ${{ github.workspace }}/.cache/grace-released-billworld-results/fleet-view-bill-qualification.json
          if-no-files-found: error
  verify:
    name: ${{ matrix.lane }}
    if: github.event_name != 'workflow_dispatch' || inputs.cross_app_only || !inputs.benchmarks_only || !(inputs.billworld || inputs.webarena || inputs.webarena_gitlab)
    runs-on: ${{ inputs.cross_app_only && vars.GRACE_CROSS_APP_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: product
            tasks: ""
    environment: &cache-environment ${{ github.event_name == 'push' && 'turbo-cache-publish' || 'turbo-cache-read' }}
    env: &cache-env
      TURBO_TOKEN: ${{ !inputs.cross_app_only && secrets.TURBO_TOKEN || '' }}
      TURBO_CACHE: ${{ !inputs.cross_app_only && secrets.TURBO_TOKEN && (github.event_name == 'push' && 'local:rw,remote:rw' || 'local:rw,remote:r') || 'local:rw' }}
    steps: &verification-steps
      # apps/app/scripts import upstream Eliza's Android tools from the vendor/eliza submodule.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - id: setup
        uses: ./.github/actions/setup
        with:
          job: ${{ matrix.lane }}
      - id: tool-selftest-cache
        if: startsWith(matrix.lane, 'selftest-') && (env.TURBO_CACHE == 'local:rw' || github.event_name == 'push')
        continue-on-error: true
        shell: bash
        env:
          TASK: ${{ matrix.tasks }}
          JOB: ${{ matrix.lane }}
        run: |
          hash=$(node vibestack/spec.ts tasks "$TASK" --only --dry=json --cache=local:w | jq -er --arg task "$TASK" '
            .tasks | select(length == 1) | .[0]
            | select(.taskId == $task and .resolvedTaskDefinition.cache == true and .resolvedTaskDefinition.outputs == [])
            | .hash
          ')
          [[ $hash =~ ^[0-9a-f]{16}$ ]] || exit 0
          archive=".turbo/cache/$hash.tar.zst"
          meta=".turbo/cache/$hash-meta.json"
          if [[ -f $archive && ! -L $archive && -s $archive && -f $meta && ! -L $meta && -s $meta ]] &&
            jq -e --arg hash "$hash" '.hash == $hash and (.duration | type == "number" and . >= 0 and floor == .)' "$meta" >/dev/null; then
            [[ $GITHUB_EVENT_NAME == push ]] || exit 0
            echo 'lookup=true' >> "$GITHUB_OUTPUT"
          fi
          printf 'hash=%s\nkey=turbo-tool-selftest-v1-%s-%s-%s-%s\n' "$hash" "$RUNNER_OS" "$RUNNER_ARCH" "$JOB" "$hash" >> "$GITHUB_OUTPUT"
      - id: restore-tool-selftest
        if: steps.tool-selftest-cache.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.tool-selftest-cache.outputs.key }}
          path: |
            .turbo/tool-selftest-cache/${{ steps.tool-selftest-cache.outputs.hash }}.tar.zst
            .turbo/tool-selftest-cache/${{ steps.tool-selftest-cache.outputs.hash }}-meta.json
          lookup-only: ${{ steps.tool-selftest-cache.outputs.lookup == 'true' }}
      - if: steps.restore-tool-selftest.outputs.cache-hit == 'true' && steps.tool-selftest-cache.outputs.lookup != 'true'
        continue-on-error: true
        shell: bash
        env:
          HASH: ${{ steps.tool-selftest-cache.outputs.hash }}
        run: |
          archive=".turbo/tool-selftest-cache/$HASH.tar.zst"
          meta=".turbo/tool-selftest-cache/$HASH-meta.json"
          [[ -f $archive && ! -L $archive && -s $archive && -f $meta && ! -L $meta && -s $meta ]] || exit 0
          jq -e --arg hash "$HASH" '.hash == $hash and (.duration | type == "number" and . >= 0 and floor == .)' "$meta" >/dev/null || exit 0
          mkdir -p .turbo/cache
          rm -f ".turbo/cache/$HASH-manifest.json"
          mv "$archive" "$meta" .turbo/cache/
      - name: Verify local Gmail delivery and account isolation
        if: ${{ matrix.lane == 'product' && inputs.cross_app_only && !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --filter @repo/app test --project node test/app.test.vibe -t "Google denies missing consent"
      - name: Verify the pinned Worker against synthetic Gmail history
        if: ${{ matrix.lane == 'product' && !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm --dir vendor/eliza --filter @elizaos/cloud exec vitest run test/cloud.test.vibe -t "watch for new mail"
      - name: Exercise Google consent and guided tasks across apps with local fixtures
        if: ${{ matrix.lane == 'product' && inputs.cross_app_only && !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          pnpm --filter @repo/app test:browser test/mail.browser.test.tsx test/app.browser.test.tsx
          -t "Gmail signup to Calendar|Follow one reviewed plan across apps|An authenticated restart restores the reviewed plan paused at its next outcome|Open a control from the agent reply|Return to owned Google mail and calendar|Sign in privately on a website|Approve the website’s exact label for one step"
      - id: verify-tasks
        if: ${{ matrix.lane == 'product' && !inputs.cross_app_only && !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm all build typecheck test test:browser check //#lint:js //#lint:css //#analyze //#selftest:docs //#selftest:examples --concurrency=2 --continue=dependencies-successful --summarize --log-order=stream
      - id: fixture-tasks
        if: ${{ matrix.lane != 'product' && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          TASK: ${{ matrix.tasks }}
        run: pnpm all "$TASK" --only --continue=dependencies-successful --summarize
      - id: publish-tool-selftest
        if: >-
          github.event_name == 'push' && steps.tool-selftest-cache.outputs.key != '' &&
          steps.restore-tool-selftest.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        env:
          TASK: ${{ matrix.tasks }}
          HASH: ${{ steps.tool-selftest-cache.outputs.hash }}
        run: |
          jq -e -s --arg task "$TASK" --arg hash "$HASH" '
            map(select(.version == "1" and .execution.exitCode == 0 and (.tasks | length == 1)))
            | map(.tasks[0] | select(.taskId == $task and .hash == $hash and .execution.exitCode == 0))
            | length == 1
          ' .turbo/runs/*.json >/dev/null || exit 0
          archive=".turbo/cache/$HASH.tar.zst"
          meta=".turbo/cache/$HASH-meta.json"
          [[ -f $archive && ! -L $archive && -s $archive && -f $meta && ! -L $meta && -s $meta ]] || exit 0
          jq -e --arg hash "$HASH" '.hash == $hash and (.duration | type == "number" and . >= 0 and floor == .)' "$meta" >/dev/null || exit 0
          mkdir -p .turbo/tool-selftest-cache
          cp "$archive" "$meta" .turbo/tool-selftest-cache/
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - if: steps.publish-tool-selftest.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.tool-selftest-cache.outputs.key }}
          path: |
            .turbo/tool-selftest-cache/${{ steps.tool-selftest-cache.outputs.hash }}.tar.zst
            .turbo/tool-selftest-cache/${{ steps.tool-selftest-cache.outputs.hash }}-meta.json
      - name: Report Turbo task timings
        id: task-timings
        if: ${{ !cancelled() }}
        env:
          RESTORED_FIXTURE_EVALUATOR: ${{ steps.setup.outputs.spec-evaluator-restored == 'true' && steps.fixture-tasks.outcome == 'success' }}
          TASK: ${{ matrix.tasks }}
        run: |
          for report in .turbo/runs/*.json; do
            [[ -f "$report" ]] || continue
            jq -r '
              select(.version == "1" and (.tasks | type == "array"))
              | .execution as $run
              | select([$run.startTime, $run.endTime, $run.cached, $run.attempted] | all(type == "number"))
              | "### Turbo task timings", "",
                "Wall time \(($run.endTime - $run.startTime) / 1000) s. Cache hits \($run.cached) of \($run.attempted) attempted tasks.",
                "",
                "| Task | Wall time (s) | Cache | Exit code |",
                "| --- | ---: | --- | ---: |",
                ([.tasks[]
                  | select([.execution.startTime, .execution.endTime] | all(type == "number"))
                  | {id: .taskId, elapsed: ((.execution.endTime - .execution.startTime) / 1000), cache: .cache.status, exit: .execution.exitCode}]
                  | sort_by(-.elapsed) | .[]
                  | "| \(.id) | \(.elapsed) | \(.cache // "-") | \(.exit // "-") |"),
                ""
            ' "$report" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::Could not read the Turbo run summary"
          done
          [[ $RESTORED_FIXTURE_EVALUATOR == true ]] || exit 0
          shopt -s nullglob
          reports=(.turbo/runs/*.json)
          (( ${#reports[@]} )) || exit 0
          jq -es --arg task "$TASK" '
            map(select(.version == "1" and any(.tasks[]?; .taskId == $task)))
            | length == 1 and
              (.[0] | .execution.exitCode == 0 and .execution.attempted == 1 and .execution.cached == 1 and
                (.tasks | length == 1 and (.[0] | .taskId == $task and .cache.status == "HIT" and
                  .execution.exitCode == 0 and .resolvedTaskDefinition.outputs == [])))
          ' "${reports[@]}" >/dev/null || exit 0
          echo 'skip-spec-cache=true' >> "$GITHUB_OUTPUT"
          echo 'Skipping the spec cache upload after a full fixture replay.'
      - id: superseded-spec-cache
        if: >-
          cancelled() && matrix.lane == 'product' && steps.verify-tasks.conclusion == 'cancelled' &&
          steps.setup.outputs.spec-cache-key != '' &&
          github.event_name == 'push' && github.run_attempt == '1' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          current=$(GIT_TERMINAL_PROMPT=0 timeout 4s git ls-remote --refs --exit-code origin "$GITHUB_REF") || exit 0
          [[ $current != *$'\n'* ]] || exit 0
          IFS=$'\t' read -r tip ref <<< "$current"
          [[ $tip =~ ^[0-9a-f]{40}$ && $ref == "$GITHUB_REF" && $tip != "$GITHUB_SHA" ]] || exit 0
          echo 'skip=true' >> "$GITHUB_OUTPUT"
          echo "Skipping the spec cache upload for superseded commit $GITHUB_SHA."
      - id: closed-pr-cache
        if: >-
          always() && github.event_name == 'pull_request' && github.run_attempt == '1' &&
          (steps.setup.outputs.spec-cache-key != '' || steps.setup.outputs.turbo-cache-key != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n $GH_TOKEN && $GITHUB_REF =~ ^refs/pull/([1-9][0-9]*)/merge$ ]] || exit 0
          number=${BASH_REMATCH[1]}
          pull=$(curl --fail --silent --max-time 4 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$number") || exit 0
          jq -e --argjson number "$number" '
            .number == $number and .state == "closed" and (.closed_at | type == "string")
          ' <<< "$pull" >/dev/null 2>&1 || exit 0
          echo 'skip=true' >> "$GITHUB_OUTPUT"
          echo "Skipping verification cache uploads for closed PR #$number."
      - if: >-
          always() && !inputs.cross_app_only && steps.setup.outputs.spec-cache-key != '' &&
          steps.superseded-spec-cache.outputs.skip != 'true' && steps.task-timings.outputs.skip-spec-cache != 'true' &&
          steps.closed-pr-cache.outputs.skip != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.setup.outputs.spec-cache-path }}
          key: ${{ steps.setup.outputs.spec-cache-key }}
      - id: prune-turbo-cache
        if: always() && !inputs.cross_app_only && steps.setup.outputs.turbo-cache-key != '' && steps.closed-pr-cache.outputs.skip != 'true'
        run: |
          [[ -d .turbo/cache ]] || exit 0
          shopt -s nullglob
          summaries=(.turbo/runs/*.json)
          if (( ${#summaries[@]} )); then
            jq -r '
              .tasks[] | select(.cache.status == "HIT")
              | .hash | select(type == "string" and test("^[a-f0-9]{16}$"))
              | ".turbo/cache/\(.)" as $entry
              | $entry + (".tar.zst", "-meta.json", "-manifest.json")
            ' "${summaries[@]}" | xargs -r touch -c --
          fi
          find .turbo/cache -type f -mtime +7 -delete
          for archive in .turbo/cache/*.tar.zst; do
            metadata="${archive%.tar.zst}-meta.json"
            [[ -f "$archive" && -s "$archive" && -f "$metadata" && -s "$metadata" ]] || continue
            echo "populated=true" >> "$GITHUB_OUTPUT"
            break
          done
      - if: always() && steps.prune-turbo-cache.outputs.populated == 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}
      - if: always() && !inputs.cross_app_only && matrix.lane == 'product'
        uses: actions/upload-artifact@v7
        with:
          name: proof
          path: |
            gen/proof/
            vibestack/studio/gen/proof/
          if-no-files-found: ignore
      - if: failure() && !inputs.cross_app_only
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.lane == 'product' && 'failures' || format('failures-{0}', matrix.lane) }}
          path: |
            test/counterexamples/
            test/__traces__/
            apps/*/test/counterexamples/
            apps/*/test/__traces__/
            packages/*/test/counterexamples/
            packages/*/test/__traces__/
            apps/*/.cache/vitest/attachments/
            packages/*/.cache/vitest/attachments/
            vibestack/studio/test/counterexamples/
            vibestack/studio/test/__traces__/
            vibestack/examples/*/test/counterexamples/
            vibestack/examples/*/test/__traces__/
          if-no-files-found: ignore
          include-hidden-files: true
  vibestack-fixture-selftests:
    name: ${{ matrix.lane }}
    if: ${{ !inputs.cross_app_only && (github.event_name != 'workflow_dispatch' || !inputs.benchmarks_only || !(inputs.billworld || inputs.webarena || inputs.webarena_gitlab)) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: selftest-a
            tasks: "//#selftest:tools:a"
          - lane: selftest-b
            tasks: "//#selftest:tools:b"
          - lane: selftest-rest
            tasks: "//#selftest:tools:rest"
    environment: *cache-environment
    env: *cache-env
    steps: *verification-steps
  verification:
    name: verify
    needs: [verify, vibestack-fixture-selftests]
    if: always() && needs.verify.result != 'skipped'
    runs-on: ${{ inputs.cross_app_only && vars.GRACE_CROSS_APP_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Require every selected verification job to pass
        env:
          CHECKS: ${{ needs.verify.result }}
          FIXTURES: ${{ needs.vibestack-fixture-selftests.result }}
          EXPECTED_FIXTURES: ${{ inputs.cross_app_only && 'skipped' || 'success' }}
        run: test "$CHECKS" = success && test "$FIXTURES" = "$EXPECTED_FIXTURES"
