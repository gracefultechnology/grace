name: android

# Grace's debug APKs (apps/app/README.md, "Android") and the AOSP overlay of the launcher debug
# APK, when something they are built from changes. Release APKs need the signing secrets
# host.json names, which CI does not hold; an unsigned release APK installs nowhere.
on:
  pull_request:
    branches: [develop, main]
    paths: &inputs
      - apps/app/**
      - spec/**
      - vibestack/**
      - package.json
      - turbo.json
      - packages/ui/**
      - packages/design-system/**
      - vendor/eliza
      - .gitmodules
      - .nvmrc
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - tsconfig.base.json
      - .github/workflows/android.yml
      - .github/actions/setup/**
  push:
    branches: [develop, main]
    paths: *inputs

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      TURBO_CACHE: local:rw
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      # apps/app/scripts import upstream Eliza's Android tools from the vendor/eliza submodule.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup
        with:
          job: product
          verification: "false"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ runner.arch }}-jdk21-${{ hashFiles('apps/app/node_modules/@capacitor/android/package.json', 'apps/app/node_modules/@capacitor/android/capacitor/build.gradle', 'apps/app/android/host.json', 'vendor/eliza/packages/os/android/host-templates/**', 'vendor/eliza/packages/os/android/*/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-jdk21-
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      # gen/ and @repo/ui's generated/ are git-ignored; the build imports both.
      - run: pnpm exec turbo run gen --filter=@repo/ui
      - id: agent-source
        run: |
          echo "pin=$(git rev-parse HEAD:vendor/eliza)" >> "$GITHUB_OUTPUT"
          echo "tools=$(node --version)-pnpm$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - name: Reuse the pinned agent bundle
        uses: actions/cache@v6
        with:
          path: vendor/eliza/packages/agent/dist/bundle
          key: android-agent-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.agent-source.outputs.pin }}-${{ steps.agent-source.outputs.tools }}-${{ hashFiles('apps/app/agent/policy.json', 'apps/app/scripts/android.ts', '.github/actions/setup/action.yml', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig*.json', 'patches/**', 'vibestack/*.ts', 'vibestack/gen/**', 'vibestack/std/**', 'vibestack/proof/**', 'vibestack/testing/**', 'vibestack/stories/**', 'vibestack/design/**', '!vibestack/**/node_modules/**', '!vibestack/**/.cache/**', '!vibestack/selftest.ts', '!vibestack/remote-cache.ts', '!vibestack/testing/test/**', '!vibestack/stories/test/**', '!vibestack/design/test/**') }}
      - run: pnpm --filter @repo/app android --abi ${{ matrix.abi }}
      - name: Stage Cuttlefish launcher with the pinned Chromium APK
        if: matrix.abi == 'x86_64'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/chromium.zip" \
            https://storage.googleapis.com/chromium-browser-snapshots/AndroidDesktop_x64/1703955/chrome-android-desktop.zip
          unzip -p "$RUNNER_TEMP/chromium.zip" chrome-android-desktop/apks/ChromePublic.apk > "$RUNNER_TEMP/Chromium.apk"
          pnpm --filter @repo/app aosp --apk artifacts/launcher-debug.apk --development --browser "$RUNNER_TEMP/Chromium.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.abi == 'arm64-v8a' && 'android' || 'android-x86_64' }}
          path: |
            apps/app/artifacts/*.apk
            apps/app/artifacts/apk-manifest.json
            apps/app/artifacts/aosp/**
