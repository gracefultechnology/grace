<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send a payment</title>
<h1>Send $40.00 to Ruth</h1>
<form action="/pay" method="post" onsubmit="return confirm('Send $40.00 to Ruth now? This cannot be undone.')">
  <input type="hidden" name="amount" value="40.00">
  <input type="hidden" name="to" value="Ruth">
  <button>Send the payment</button>
</form>
