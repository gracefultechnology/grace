<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverside Power: choose an amount</title>
<h1>How much would you like to pay?</h1>
<p>Your bill of $84.12 is due in two weeks.</p>
<form action="review.html" method="get">
  <label><input type="radio" name="amount" value="84.12" required> Statement balance, $84.12</label>
  <label><input type="radio" name="amount" value="25.00"> Minimum payment, $25.00</label>
  <label><input type="radio" name="amount" value="other"> Another amount <input name="other" inputmode="decimal" aria-label="Another amount"></label>
  <button>Continue</button>
</form>
