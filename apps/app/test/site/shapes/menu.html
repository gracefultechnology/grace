<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverside Power: my account</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; }
  header, main { padding: 12px 24px; }
</style>
<header>
  <button type="button" aria-expanded="false" aria-controls="account-menu" id="account">My account</button>
  <ul id="account-menu" hidden>
    <li><a href="topic.html?usage">Usage</a></li>
    <li><a href="topic.html?billing">Billing and payments</a></li>
    <li><a href="topic.html?profile">Profile</a></li>
  </ul>
</header>
<main>
  <h1>Welcome back</h1>
  <p><a href="topic.html?outages">Outages</a></p>
  <p><a href="topic.html?help">Help</a></p>
  <p>Open My account to see your usage, your bills and your profile.</p>
</main>
<script>
  const button = document.getElementById("account");
  const menu = document.getElementById("account-menu");
  button.addEventListener("click", () => {
    const open = button.getAttribute("aria-expanded") !== "true";
    button.setAttribute("aria-expanded", String(open));
    menu.hidden = !open;
  });
</script>
